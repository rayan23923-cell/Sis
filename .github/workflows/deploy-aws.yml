name: Deploy to AWS

# Ships SIS to the AWS server made by deploy/aws/sis.yaml (see deploy/aws/README.md).
# No AWS keys are stored: GitHub proves who it is by OIDC and gets a short-lived role that can only
# run commands on that one server. The server fetches this commit and runs deploy/aws/deploy.sh
# (database backup, build, migrate, HTTPS).
#
# Repository variables (Settings > Secrets and variables > Actions > Variables), from the stack's Outputs:
#   AWS_ROLE_ARN, AWS_INSTANCE_ID, AWS_REGION
# Optional: SIS_DOMAIN (own domain whose A record points at the server; otherwise <ip>.sslip.io).
# Until AWS_ROLE_ARN is set this workflow skips itself. This repository is public: the log never prints secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy on the server
        env:
          INSTANCE: ${{ vars.AWS_INSTANCE_ID }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DOMAIN: ${{ vars.SIS_DOMAIN }}
        run: |
          python3 - > /tmp/params.json <<'PY'
          import json, os, re
          domain = os.environ.get("DOMAIN", "").strip().lower()
          if domain and not re.fullmatch(r"[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+", domain):
              raise SystemExit("SIS_DOMAIN is not a valid host name")
          url = "https://codeload.github.com/%s/tar.gz/%s" % (os.environ["REPO"], os.environ["SHA"])
          print(json.dumps({"commands": [
              "set -eu",
              "export HOME=/root",
              "mkdir -p /opt/sis /etc/sis",
              "printf '%%s' '%s' > /etc/sis/domain" % domain,
              "curl -fsSL %s -o /tmp/sis-release.tgz" % url,
              "tar xzf /tmp/sis-release.tgz --strip-components=1 -C /opt/sis",
              "rm -f /tmp/sis-release.tgz",
              # The full log stays on the server (SSM keeps only the first 24 KB of output).
              "cd /opt/sis && rc=0 && sh deploy/aws/deploy.sh > /var/log/sis-deploy.log 2>&1 || rc=$?",
              "tail -n 60 /var/log/sis-deploy.log",
              "exit $rc",
          ], "executionTimeout": ["3000"]}))
          PY
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
                 --comment "SIS ${SHA:0:7}" --timeout-seconds 600 --parameters file:///tmp/params.json \
                 --query Command.CommandId --output text)
          echo "SSM command $id"
          while :; do
            sleep 15
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) echo "... $status";; *) break;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query StandardOutputContent --output text | tee /tmp/out.txt
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query StandardErrorContent --output text >&2
          url=$(sed -n 's/^SIS_URL=//p' /tmp/out.txt | tail -1)
          echo "SITE=$url" >> "$GITHUB_ENV"
          [ "$status" = Success ] || { echo "::error::Deploy finished with status $status."; exit 1; }

      - name: Check the site answers
        run: |
          [ -n "$SITE" ] || { echo "::error::The server did not report its address."; exit 1; }
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/login" || true)
            [ "$code" = 200 ] && { echo "$SITE/login answers 200."; exit 0; }
            sleep 6
          done
          echo "::error::$SITE/login did not answer 200 (last: $code)."; exit 1

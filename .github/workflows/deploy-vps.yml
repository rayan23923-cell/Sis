name: Deploy to VPS (staging)

# Ships SIS staging to https://sis.azoclinic.duckdns.org on the same VPS as FileNest, in its own
# folder and containers, behind the shared Caddy. For now it only checks the server and serves a
# placeholder page; the Laravel app joins deploy/vps/docker-compose.yml once it exists.
#
# Repository secret: VPS_SSH_KEY (private key of the ubuntu user, no passphrase).
# Optional: VPS_HOST (default 193.123.83.82), VPS_USER (default ubuntu).
# This repository is public, so the log prints only the server's shape, never secrets or file contents.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  APP_DIR: /home/ubuntu/sis
  DOMAIN: sis.azoclinic.duckdns.org
  SITE: https://sis.azoclinic.duckdns.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the VPS key
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret VPS_SSH_KEY is not set on this repository (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '193.123.83.82' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/vps_key
          # A key pasted on one line (line breaks turned into spaces) is put back into PEM shape.
          if [ "$(grep -c . ~/.ssh/vps_key)" -le 2 ] && grep -q -- '-----BEGIN' ~/.ssh/vps_key; then
            python3 - <<'PY'
          import os, re
          p = os.path.expanduser('~/.ssh/vps_key')
          t = open(p).read().strip()
          m = re.match(r'(-----BEGIN [A-Z ]+-----)(.*?)(-----END [A-Z ]+-----)', t, re.S)
          if m:
              body = ''.join(m.group(2).split())
              lines = [body[i:i+64] for i in range(0, len(body), 64)]
              open(p, 'w').write(m.group(1) + '\n' + '\n'.join(lines) + '\n' + m.group(3) + '\n')
          PY
          fi
          chmod 600 ~/.ssh/vps_key
          echo "key lines: $(grep -c . ~/.ssh/vps_key)"
          ssh-keygen -y -f ~/.ssh/vps_key >/dev/null && echo "key reads OK" || { echo "::error::VPS_SSH_KEY is not a valid private key (paste the whole file, including the BEGIN and END lines)."; exit 1; }
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check the server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '193.123.83.82' }}
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
        run: |
          ssh -i ~/.ssh/vps_key -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" '
            echo "== system"; . /etc/os-release; echo "$PRETTY_NAME, kernel $(uname -r), $(uname -m)"
            echo "cpus: $(nproc)"; uptime
            echo "== memory (MB)"; free -m
            echo "== disk"; df -h / | tail -1
            echo "== docker"; sudo docker version --format "server {{.Server.Version}}" 2>&1
            sudo docker compose version 2>&1
            echo "== containers"; sudo docker ps -a --format "{{.Names}}\t{{.Status}}"
            echo "== shared network"; sudo docker network inspect headscale_default --format "{{.Name}} ok" 2>&1
            echo "== caddy"; sudo docker ps --filter name=^caddy$ --format "{{.Names}} {{.Image}} {{.Status}}"
            test -f /home/ubuntu/headscale/Caddyfile && echo "Caddyfile found, $(grep -c "{" /home/ubuntu/headscale/Caddyfile) blocks" || echo "Caddyfile not found"
          '
          echo "== DNS for $DOMAIN"
          getent hosts "$DOMAIN" || echo "::warning::$DOMAIN does not resolve yet."

      - name: Copy and start
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '193.123.83.82' }}
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
        run: |
          tar czf /tmp/deploy.tgz deploy
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "mkdir -p '$APP_DIR' && tar xzf - -C '$APP_DIR'" < /tmp/deploy.tgz
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "cd '$APP_DIR' && chmod -R a+rX deploy/vps/site \
            && sudo docker compose -f deploy/vps/docker-compose.yml up -d --remove-orphans \
            && SIS_DOMAIN='$DOMAIN' sh deploy/vps/caddy-site.sh \
            && sudo docker ps --filter name=sis- --format '{{.Names}}  {{.Status}}'"

      - name: Check the site answers
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/" || true)
            [ "$code" = 200 ] && { echo "$SITE answers 200."; exit 0; }
            sleep 6
          done
          echo "::error::$SITE did not answer 200 (last: $code)."; exit 1

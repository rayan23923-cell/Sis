name: Reset staging passwords

# Sets the password of every staging account (admin@sis.local and the demo *@sis.local accounts)
# from a bcrypt hash given at run time, and removes the old password files from the server.
# Only the hash passes through here (base64), never the password itself; the repository is public.
on:
  workflow_dispatch:
    inputs:
      password_hash_b64:
        description: base64 of a bcrypt hash (cost 12)
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '193.123.83.82' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keygen -y -f ~/.ssh/vps_key >/dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Set the passwords and remove the old files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '193.123.83.82' }}
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
          HASH_B64: ${{ inputs.password_hash_b64 }}
        run: |
          case "$HASH_B64" in *[!A-Za-z0-9+/=]*) echo "::error::not base64"; exit 1;; esac
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "
            sudo docker exec -e HASH_B64='$HASH_B64' sis-app php artisan tinker --execute='
              \$h = base64_decode(getenv(\"HASH_B64\"));
              if (! str_starts_with(\$h, \"\\\$2y\\\$\")) { echo \"bad hash\"; exit(1); }
              \$n = Illuminate\Support\Facades\DB::table(\"users\")->where(\"email\", \"like\", \"%@sis.local\")->update([\"password\" => \$h]);
              echo \"accounts updated: \$n\";
            '
            echo
            sudo docker exec sis-app rm -f storage/app/private/admin-password.txt && echo 'removed the password file in the app'
            rm -f ~/sis-admin-password.txt && echo 'removed ~/sis-admin-password.txt'
          "

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite, bcmath, gd, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --no-audit --no-fund && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: php vendor/bin/phpunit

  # B-05 (FR-QA-01): the whole suite again on the real database, on each server version we ship.
  # 10.11.10 = the Windows offline bundle (offline-windows.yml MARIADB_VERSION); 11.8 = staging (deploy/vps/docker-compose.yml).
  mariadb:
    name: tests (MariaDB ${{ matrix.mariadb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mariadb: ['10.11.10', '11.8']
    services:
      db:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_DATABASE: sis_test
          MARIADB_USER: sis
          MARIADB_PASSWORD: sis-ci-only
          MARIADB_ROOT_PASSWORD: root-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: sis_test
      DB_USERNAME: sis
      DB_PASSWORD: sis-ci-only
      SIS_EXPECTED_DB_VERSION: ${{ matrix.mariadb }}
      # B-09: a second database and an account limited to it, to restore a backup as someone other than its maker
      SIS_RESTORE_DB_DATABASE: sis_restore
      SIS_RESTORE_DB_USERNAME: sis_restorer
      SIS_RESTORE_DB_PASSWORD: restorer-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_mysql, bcmath, gd, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --no-audit --no-fund && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - name: MariaDB client tools (mariadb-dump, as on the servers) and the restore database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client
          # the runner's client (11.x) asks for TLS by default; the 10.11 test server has none (no secrets cross)
          printf '[client]\nskip-ssl\n' > ~/.my.cnf
          mariadb -h127.0.0.1 -uroot -proot-ci-only -e "CREATE DATABASE sis_restore; CREATE USER 'sis_restorer'@'%' IDENTIFIED BY 'restorer-ci-only'; GRANT ALL ON sis_restore.* TO 'sis_restorer'@'%';"
      - name: Suite on MariaDB
        run: php vendor/bin/phpunit
      - name: MariaDB-only tests must run here, not skip
        run: php vendor/bin/phpunit --group mariadb --fail-on-skipped

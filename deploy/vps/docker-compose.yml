# SIS staging on the VPS (same server and shared Caddy as FileNest, network `headscale_default`).
# Until the Laravel app exists this serves only a placeholder page; the app, db, queue and scheduler
# services join here in the same shape as FileNest's deploy/vps/docker-compose.yml.
# Run from the repo root:  docker compose -f deploy/vps/docker-compose.yml up -d
# Container names start with sis- so nothing clashes with FileNest, the dental app or other services.
name: sis

services:
  web:
    image: nginx:1.27-alpine
    container_name: sis-web
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
    networks: [edge]

networks:
  edge:
    external: true
    name: headscale_default

# Runs behind the shared Caddy HTTPS front end on the VPS (Docker network `headscale_default`).
map $request_method $sis_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $sis_login_key zone=sis_login:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 20m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /login {
        limit_req zone=sis_login burst=10 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    # App installers and the offline server package: always saved as a file with the right type.
    location ~* ^/downloads/[^/]+\.(apk|exe|ipa|zip)$ {
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream exe ipa;
            application/zip zip;
        }
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_hide_header X-Powered-By;
    }

    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(ico|png|jpg|jpeg|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.(?!well-known) { deny all; }
}
